<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Configuração</title>
<style>
  :root { --bg:#0a0f18; --panel:#111a28; --line:#1e2b40; --text:#dbe6f5; --dim:#7f91ab; --cyan:#3fd8ff; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.35 "Segoe UI", system-ui, sans-serif; padding: 18px; }
  h3 { font-size: 14px; } .spacer { flex: 1; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  input[type=text], input[type=number] { width: 100%; height: 30px; padding: 0 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); outline: none; font: inherit; }
  input:focus { border-color: var(--cyan); }
  .linha { display: flex; gap: 8px; margin-bottom: 6px; } .linha input:first-child { width: 160px; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 12px; margin: 8px 0; }
  .acoes { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
  .acoes button { border: 1px solid var(--line); height: 32px; padding: 0 14px; border-radius: 6px;
    background: var(--panel); color: var(--text); cursor: pointer; font: inherit; }
  .acoes .primary { background: var(--cyan); border-color: var(--cyan); color: #04121a; font-weight: 600; }
</style>
</head>
<body>
<h3 style="font-size:14px;margin-bottom:2px">Configuração</h3>
    <p style="color:var(--dim);font-size:12px">Nome e URL de cada painel. URL vazia usa a URL geral.</p>
    <label>URL do jogo</label>
    <input type="text" id="url">
    <div id="perfis"></div>
    <label title="Vazio = procura sozinho: Edge primeiro, depois Chrome">Navegador (vazio = automático: Edge, depois Chrome)</label>
    <input type="text" id="navegador" placeholder="C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe">
    <div id="navEmUso" style="color:var(--dim);font-size:11.5px;margin-top:4px"></div>
    <label>Parâmetros extras do navegador (opcional)</label>
    <input type="text" id="argsExtras" placeholder="--disable-features=msEdgeSidebarV2">
    <label>Abas extras (URL vazia remove a aba)</label>
    <div id="extras"></div>
    <label class="check"><input type="checkbox" id="abrirAoIniciar"> Abrir os painéis ao iniciar o app</label>
    <label>Login automático padrão (cada painel pode ter o seu, na chave da faixa)</label>
    <select id="metodoLogin" style="width:100%;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit">
      <option value="formulario">Preencher usuário e senha salvos</option>
      <option value="google">Clicar em "Entrar com Google"</option>
      <option value="nenhum">Não fazer nada</option>
    </select>
    <div style="color:var(--dim);font-size:11.5px;margin-top:4px">Nos dois casos o app para aí: a verificação "confirme que é humano", o botão Entrar e qualquer senha do Google são você quem faz.</div>
    <label class="check"><input type="checkbox" id="reconectar"> Reconectar sozinho quando a página cair</label>
    <label class="check"><input type="checkbox" id="travado"> Tratar como queda se a tela não mudar por
      <input type="number" id="minutos" min="1" max="60" style="width:56px;height:26px"> min</label>
    <div style="display:flex;gap:10px">
      <div style="flex:1"><label>Porta base do navegador (muda ao reabrir)</label><input type="number" id="porta" min="1024" max="65535"></div>
      <div style="width:150px"><label title="Altura da barra que o Chrome desenha">Recorte do topo (px)</label><input type="number" id="recorte" min="0" max="80"></div>
    </div>
    <div class="acoes">
      <button id="pasta">Abrir pasta dos perfis</button>
      <span class="spacer"></span>
      <button id="cancelar">Cancelar</button>
      <button class="primary" id="salvar">Salvar</button>
    </div>
<script src="config.js"></script>
</body>
</html>
