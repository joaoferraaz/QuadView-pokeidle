<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>QuadView</title>
<style>
  :root { --bg:#0a0f18; --panel:#111a28; --line:#1e2b40; --text:#dbe6f5; --dim:#7f91ab;
          --cyan:#3fd8ff; --magenta:#ff4fa3; --violet:#9b7bff; --gold:#f5c451; --verde:#48d597; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.2 "Segoe UI", system-ui, sans-serif; user-select: none; }
  #topo { position: fixed; inset: 0 0 auto 0; height: 44px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-bottom: 1px solid var(--line); }
  .logo { font-weight: 700; letter-spacing: .03em; } .logo b { color: var(--cyan); }
  .dica { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  button { all: unset; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px;
    border-radius: 6px; color: var(--dim); cursor: pointer; }
  button:hover { background: #18243a; color: var(--text); }
  button:focus-visible { outline: 1px solid var(--cyan); }
  button.on { color: var(--cyan); }
  button.alerta { color: var(--gold); }
  button.alerta:hover { background: #2a2312; color: var(--gold); }
  svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #tiraAbas { position: fixed; left: 0; right: 0; display: flex; align-items: stretch; gap: 2px;
    padding: 0 8px; border-bottom: 1px solid var(--line); background: #0c1422; }
  .aba { display: flex; align-items: center; gap: 7px; padding: 0 14px; cursor: pointer;
    color: var(--dim); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 12.5px; }
  .aba:hover { color: var(--text); background: #131f33; }
  .aba.ativa { color: var(--accent); border-bottom-color: var(--accent); background: var(--panel); font-weight: 600; }
  .aba.extra { margin-left: auto; }
  .ferramentas { display: flex; align-items: center; gap: 2px; padding-left: 8px; }
  .cab { position: fixed; display: flex; align-items: center; gap: 2px; padding: 0 4px 0 10px;
    background: var(--panel); border-top: 2px solid var(--accent); }
  .cab .nome { font-weight: 600; color: var(--accent); margin-right: 8px; white-space: nowrap; }
  /* Onde o teclado está agora. Sem essa marca a pessoa só descobre digitando. */
  .cab .kbd { font-size: 10px; line-height: 1; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 4px;
    padding: 3px 5px; margin-right: 8px; white-space: nowrap; }
  .cab.comTeclado { border-top-width: 3px; }
  .cab .st { flex: 1; min-width: 0; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st.alerta { color: var(--gold); } .st.ruim { color: var(--magenta); } .st.ok { color: var(--verde); }
  .ponto { width: 6px; height: 6px; border-radius: 50%; background: #3a4a63; margin-right: 8px; flex-shrink: 0; }
  .ponto.ok { background: var(--verde); } .ponto.aviso { background: var(--gold); } .ponto.ruim { background: var(--magenta); }
  .ponto.piscando { animation: pulse .9s ease-in-out infinite alternate; }
  @keyframes pulse { to { opacity: .2; } }
  .vazio { position: fixed; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: var(--dim); border: 1px dashed var(--line);
    background: repeating-linear-gradient(45deg, transparent 0 12px, #0d1420 12px 24px); }
  .vazio button { border: 1px solid var(--line); color: var(--text); padding: 0 14px; height: 30px; }
  .vazio .msg { font-size: 12px; max-width: 80%; text-align: center; }
  /* Faixa propria: painel encaixado e janela nativa e sempre cobriria um aviso flutuante. */
  #aviso { position: fixed; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: #1d1708; border-bottom: 1px solid var(--gold);
    color: var(--gold); font-size: 12px; }
  #aviso .texto { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #aviso button { color: var(--gold); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="topo">
    <span class="logo"><b>[</b> QuadView <b>]</b></span>
    <span class="dica" id="dica"></span>
    <span class="spacer"></span>
    <button data-g="abrir-todos">Abrir tudo</button>
    <button data-g="modo" id="btModo" title="Alternar entre grid e abas (Ctrl+T)"></button>
    <button data-g="grade" id="btGrade" title="Grid 2x2 (Ctrl+0)"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>Grid</button>
    <button data-g="recarregar-todos">Recarregar</button>
    <button data-g="extensoes" title="Scripts que o app carrega nos painéis do jogo"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/><path d="M11.5 2.5v4M9.5 4.5h4"/></svg>Extensões</button>
    <button data-g="config" title="Configurar"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg></button>
  </div>
  <div id="tiraAbas" hidden></div>
  <div id="aviso" hidden><span class="texto"></span><button id="fecharAviso" title="Fechar aviso">✕</button></div>
  <div id="paineis"></div>

  <script src="casca.js"></script>
</body>
</html>
