<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ícone original do QuadView: quatro painéis numa janela só, nas cores que a barra do app
       já usa para identificar cada conta (ciano, magenta, violeta, dourado). -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162034"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#fundo)"/>
  <rect x="8" y="8" width="496" height="496" rx="98" fill="none" stroke="#2b3b58" stroke-width="10"/>

  <!-- barra de título do app, com o ponto de status aceso -->
  <rect x="74" y="92" width="364" height="44" rx="18" fill="#101a2c"/>
  <circle cx="106" cy="114" r="11" fill="#48d597"/>
  <rect x="132" y="107" width="104" height="14" rx="7" fill="#33456a"/>

  <!-- os quatro painéis -->
  <g>
    <rect x="74" y="164" width="172" height="130" rx="22" fill="#3fd8ff"/>
    <rect x="266" y="164" width="172" height="130" rx="22" fill="#ff4fa3"/>
    <rect x="74" y="314" width="172" height="130" rx="22" fill="#9b7bff"/>
    <rect x="266" y="314" width="172" height="130" rx="22" fill="#f5c451"/>
  </g>
</svg>
